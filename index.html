<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <p id="par1">DOM</p>
    <p class="par2">DOM</p>
    <!-- HTML -->
    <ul id="tasks"></ul>
    <div id="card" data-user-name="kelvin"></div>
    <ul id="list">
  <li data-id="1">one</li>
  <li data-id="2">two</li>
</ul>
<!-- index.html -->
<button id="helloBtn">Say hi</button>
<p id="greeting">...</p>

<script>
  // Wait until DOM is ready (script at end of body would also work)
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('helloBtn');
    const p = document.getElementById('greeting');

    btn.addEventListener('click', () => {
      // Use textContent to avoid XSS
      p.textContent = 'Hello — you clicked the button!';
    });
  });
</script>


</body>
</html>
